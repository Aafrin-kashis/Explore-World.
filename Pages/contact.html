<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style1.css">
    <title>contact</title>
</head>
<body>
    
     <header>
    <nav>
        <div class="logo">
        <img src="/Assets/logo.png" alt="logo" height="80px">
        <h2>EXPLORE WORLD</h2>
        </div>

        <div class="pageLink">
            <a href="../index.html">Home</a>
            <a href="Destinations.html">Destinations</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </nav>
    </header>

    <div class="contact-form">
    <h2>Contact Us</h2>

    <form>

        <div class="form-group">
            <label for="name">User Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="mobile">Mobile No</label>
            <input type="tel" id="mobile" placeholder="Enter your mobile number">
        </div>

        <div class="form-group">
            <label for="destination">Travel Destination</label>
            <select id="destination">
                <option>Select Destination</option>
                <option>Paris</option>
                <option>Bali</option>
                <option>Switzerland</option>
                <option>Tokyo</option>
                <option>Dubai</option>
                <option>Maldives</option>
            </select>
        </div>

        <div class="form-group">
            <label for="month">Preferred Month</label>
            <select id="month">
                <option>Select Month</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
            </select>
        </div>

        <div class="form-group">
            <label for="comment">Comment</label>
            <textarea id="comment" placeholder="Write your comments here"></textarea>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="newsletter">
            <label for="newsletter">
                Subscribe to our travel newsletter
            </label>
        </div>

        <button type="submit">Submit</button>

    </form>
</div>

     <footer>
        <div class="foot">
            <small>© 2026 Explore World.All rights reserved</small>
            <div class="follow">
            <small>follow us</small>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-telegram"></i>
            </div>
            <small>Contact info</small>
        </div>
    </footer>
    
</body>
</html>
